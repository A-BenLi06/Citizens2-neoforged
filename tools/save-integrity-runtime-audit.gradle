// Opt-in native serialization checks. No fixture code belongs in a release archive.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/save-integrity-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/save-integrity-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'save-integrity-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated save-integrity fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[SAVEINTEGRITYAUDIT] FAILED') || !log.contains('[SAVEINTEGRITYAUDIT] COMPLETE'))
                    throw new GradleException('Save-integrity audit failed or incomplete')
            }
        }
    }
}
