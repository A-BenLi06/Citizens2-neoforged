// Destructive command tests run only against this separately prepared fixture.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/removal-audit-server')
        p.sourceSets.dialogue.java.srcDir(p.file('../tools/removal-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'removal-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated removal-audit fixture before running destructive tests')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[REMOVALAUDIT] FAILED') || !log.contains('[REMOVALAUDIT] COMPLETE'))
                    throw new GradleException('Removal command audit failed or incomplete; inspect isolated latest.log')
            }
        }
    }
}
