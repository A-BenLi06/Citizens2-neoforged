// Opt-in only: run against the isolated audit server, never the production directory.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') != null) {
            p.sourceSets.dialogue.java.srcDir(p.file('../tools/runtime-audit'))
            p.sourceSets.main.java.srcDir(p.file('../tools/runtime-audit-main'))
            p.neoForge.runs.named('server') { gameDirectory = p.file('../artifacts/audit-server') }
            p.tasks.named('prepareServerRun') {
                def fixture = p.file('../artifacts/audit-server/world/datapacks/npctest')
                inputs.dir(p.file('../tools/runtime-audit-datapack'))
                outputs.dir(fixture)
                doLast {
                    if (!new File(fixture, 'pack.mcmeta').isFile())
                        throw new GradleException('Prepare the isolated npctest server fixture before running runtime audits')
                    p.copy {
                        from p.file('../tools/runtime-audit-datapack')
                        into fixture
                    }
                }
            }
            p.tasks.named('runServer') {
                doLast {
                    def log = p.file('../artifacts/audit-server/logs/latest.log').getText('UTF-8')
                    def passed = (log =~ /\[NPCTEST\] PASS ([\w-]+)/).collect { it[1] }.toSet()
                    def missing = p.file('../tools/runtime-audit-expected.txt').readLines('UTF-8')
                            .findAll { !it.isBlank() && !log.contains(it) }
                    if (log.contains('[NPCTEST] FAIL') || log.contains('[ACTIONAUDIT] FAILED')
                            || log.contains('[SENTINELAUDIT] FAILED') || log.contains('[NATIVEAPIAUDIT] FAILED')
                            || log.contains('[SHOPAUDIT] FAILED') || !missing.isEmpty()) {
                        throw new GradleException("Runtime audit failed or incomplete: ${passed.size()} NPC assertions, missing ${missing}; inspect isolated logs/latest.log")
                    }
                }
            }
        }
    }
}
