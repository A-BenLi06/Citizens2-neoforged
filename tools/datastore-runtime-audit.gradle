// Opt-in persistence/provider fixture; never compiled into ordinary release archives.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def phase = p.findProperty('datastorePhase') ?: 'absent'
        if (!(phase in ['absent', 'present', 'absent-again'])) throw new GradleException('Unknown datastore audit phase')
        def fixture = p.file('../artifacts/datastore-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/datastore-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
            systemProperty 'citizens.datastore.audit.phase', phase
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'datastore-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated datastore fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[DATASTOREAUDIT] FAILED') || !log.contains('[DATASTOREAUDIT] COMPLETE')
                        || !log.contains('phase=' + phase)) throw new GradleException('Datastore audit failed or incomplete')
            }
        }
    }
}
