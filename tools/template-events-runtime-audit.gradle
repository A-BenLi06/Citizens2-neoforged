// Opt-in core-only fixture. Production source sets and ordinary archives do not include this probe.
allprojects {
    def buildPath = gradle.startParameter.projectProperties.get('templateEventsBuildDir')
    if (buildPath == null) throw new GradleException('Supply an isolated templateEventsBuildDir')
    layout.buildDirectory.set(file(buildPath))
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixturePath = gradle.startParameter.projectProperties.get('templateEventsFixture')
        if (fixturePath == null) throw new GradleException('Supply an isolated templateEventsFixture')
        def artifacts = p.file('../artifacts').toPath().toAbsolutePath().normalize()
        def fixture = p.file(fixturePath).toPath().toAbsolutePath().normalize()
        def output = p.layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()
        if (!fixture.startsWith(artifacts) || !output.startsWith(artifacts))
            throw new GradleException('Fixture and build must be confined to task artifacts')
        def original = gradle.startParameter.projectProperties.get('templateEventsOriginalSources')
        if (original != null) {
            def source = p.file(original).toPath().toAbsolutePath().normalize()
            if (!source.startsWith(artifacts)) throw new GradleException('Original sources must be under artifacts')
            p.sourceSets.main.java.setSrcDirs([source.toFile()])
        }
        p.sourceSets.main.java.srcDir(p.file('../tools/template-events-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture.toFile() }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!fixture.resolve('template-events-fixture.txt').toFile().isFile())
                    throw new GradleException('Prepare the isolated template events fixture first')
                def phase = fixture.resolve('phase.txt').toFile().text.strip()
                if (!(phase in ['seed', 'recover']) || fixture.resolve(phase + '.complete').toFile().exists())
                    throw new GradleException('Invalid or already completed phase; preserve the accepted attempt')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = fixture.resolve('logs/latest.log').toFile().getText('UTF-8')
                if (original != null) {
                    if (!log.contains('AssertionError: ordinary_snapshot_contains_applied_event_commands'))
                        throw new GradleException('Original template persistence defect was not reproduced')
                } else if (log.contains('[TEMPLATEEVENTAUDIT] FAILED') || !log.contains('[TEMPLATEEVENTAUDIT] COMPLETE')) {
                    throw new GradleException('Template events audit failed or incomplete')
                }
            }
        }
    }
}
