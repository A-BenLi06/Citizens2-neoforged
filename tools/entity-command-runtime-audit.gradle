allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/entity-command-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/entity-command-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
            systemProperty 'citizens.audit.effectProvider', p.findProperty('effect_audit_provider') ?: 'false'
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'entity-command-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated entity-command fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[ENTITYCOMMANDAUDIT] FAILED') || !log.contains('[ENTITYCOMMANDAUDIT] COMPLETE'))
                    throw new GradleException('Entity command audit failed or incomplete')
            }
        }
    }
}
