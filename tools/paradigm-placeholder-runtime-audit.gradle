allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def provider = p.findProperty('placeholder_audit_provider') != 'false'
        def fixture = p.file(provider ? '../artifacts/paradigm-placeholder-audit-server' : '../artifacts/paradigm-placeholder-fallback-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/paradigm-placeholder-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'paradigm-placeholder-audit-fixture.txt').isFile()
                        || new File(fixture, 'mods/paradigm.jar').isFile() != provider)
                    throw new GradleException('Prepare the isolated placeholder fixture for this provider mode')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[PARADIGMPLACEHOLDERAUDIT] FAILED') || !log.contains('[PARADIGMPLACEHOLDERAUDIT] COMPLETE'))
                    throw new GradleException('Paradigm placeholder audit failed or incomplete')
            }
        }
    }
}
