allprojects {
    def auditBuild = gradle.startParameter.projectProperties.get('guardAuditBuildDir')
    if (auditBuild != null) {
        def output = file(auditBuild).toPath().toAbsolutePath().normalize()
        def artifacts = file('../artifacts').toPath().toAbsolutePath().normalize()
        if (!output.startsWith(artifacts) || output == artifacts) throw new GradleException('Guard build must be inside task artifacts')
        def cache = gradle.startParameter.projectCacheDir
        if (cache != null && cache.toPath().toAbsolutePath().normalize().startsWith(output))
            throw new GradleException('Guard project cache must remain outside build outputs')
        layout.buildDirectory.set(output.toFile())
    }
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file(p.findProperty('guardAuditFixture') ?: '../artifacts/guard-audit-server')
        def artifacts = p.file('../artifacts').toPath().toAbsolutePath().normalize()
        if (!fixture.toPath().toAbsolutePath().normalize().startsWith(artifacts) || fixture.toPath().toAbsolutePath().normalize() == artifacts)
            throw new GradleException('Guard fixture must be inside task artifacts')
        def phase = p.findProperty('guardAuditPhase') ?: 'coexist'
        if (!(phase in ['coexist', 'restart-seed', 'restart-recover'])) throw new GradleException('Unknown Guard audit phase')
        p.sourceSets.main.java.srcDir(p.file('../tools/guard-runtime-audit'))
        p.sourceSets.main.compileClasspath += p.files(new File(fixture, 'mods/guardvillagers.jar'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
            systemProperty('citizens.guard.audit.reproduction', p.findProperty('guard_reproduction') ?: 'false')
        }
        def validateFixture = {
                def marker = new File(fixture, 'guard-audit-fixture.txt')
                if (!marker.isFile() || marker.getText('UTF-8').trim() != 'citizens-guard-audit') throw new GradleException('Missing or incorrect Guard fixture marker')
                def state = new File(fixture, 'guard-restart-state.json')
                if (phase == 'restart-seed' && state.exists()) throw new GradleException('Guard restart seed requires a fresh fixture')
                if (phase == 'restart-recover' && !state.isFile()) throw new GradleException('Run Guard restart seed before recovery')
                if (phase == 'restart-recover' && new File(fixture, 'guard-restart-recovery.json').exists()) throw new GradleException('Guard restart recovery has completed; preserve its fixture')
                if (phase == 'coexist' && state.exists()) throw new GradleException('Coexistence must not overwrite a Guard restart fixture')
                def properties = new Properties()
                new File(fixture, 'server.properties').withInputStream { properties.load(it) }
                for (entry in ['server-ip':'127.0.0.1', 'server-port':'25630', 'level-name':'guard-world'])
                    if (properties.getProperty(entry.key) != entry.value) throw new GradleException('Unexpected Guard fixture properties')
        }
        p.tasks.named('prepareServerRun') { doLast { validateFixture() } }
        p.tasks.named('runServer') {
            environment 'CITIZENS_GUARD_AUDIT_PHASE', phase
            doFirst { validateFixture() }
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[GUARDAUDIT] FAILED') || !log.contains('[GUARDAUDIT] COMPLETE'))
                    throw new GradleException('Guard audit failed or incomplete')
            }
        }
    }
}
