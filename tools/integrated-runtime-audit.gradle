allprojects {
    def auditBuild = gradle.startParameter.projectProperties.get('integratedAuditBuildDir')
    if (auditBuild == null) throw new GradleException('Pass an isolated integratedAuditBuildDir')
    def artifacts = file('../artifacts').canonicalFile.toPath()
    def output = file(auditBuild).canonicalFile.toPath()
    if (!output.startsWith(artifacts) || output == artifacts)
        throw new GradleException('Integrated build must be an isolated directory inside task artifacts')
    layout.buildDirectory.set(file(auditBuild))
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file(p.property('integratedAuditFixture'))
        if (!fixture.toPath().toAbsolutePath().normalize().startsWith(p.file('../artifacts').toPath().toAbsolutePath().normalize()))
            throw new GradleException('Integrated fixture must be inside task artifacts')
        if (!new File(fixture, 'integrated-audit-fixture.json').isFile()) throw new GradleException('Missing integrated fixture marker')
        def providers = p.files(p.fileTree(new File(fixture, 'mods')) { include '*.jar' },
                p.fileTree(new File(fixture, 'compile-libs')) { include '*.jar' })
        p.sourceSets.create('mainProbe') {
            java.srcDir(p.file('../tools/xmod-runtime-audit'))
            java.srcDir(p.file('../tools/integrated-runtime-audit'))
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath + providers
        }
        p.sourceSets.create('dialogueProbe') {
            java.srcDirs(p.file('../tools/logging-runtime-audit'), p.file('../tools/quest-runtime-audit'))
            compileClasspath += p.sourceSets.dialogue.output + p.sourceSets.dialogue.compileClasspath + providers
        }
    }
}
