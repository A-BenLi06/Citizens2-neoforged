// Opt-in custom-store lifecycle checks, confined to a synthetic server fixture.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def phase = p.findProperty('storeSwitchPhase') ?: 'runtime'
        if (!(phase in ['runtime', 'early', 'late'])) throw new GradleException('Unknown store-switch phase')
        def fixture = p.file('../artifacts/store-switch-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/store-switch-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
            systemProperty 'citizens.store-switch.audit.phase', phase
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'store-switch-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated store-switch fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[STORESWITCHAUDIT] FAILED') || !log.contains('[STORESWITCHAUDIT] COMPLETE')
                        || !log.contains('phase=' + phase)) throw new GradleException('Store-switch audit failed or incomplete')
            }
        }
    }
}
