allprojects {
    layout.buildDirectory.set(file(gradle.startParameter.projectProperties.get('deliveryAuditBuildDir') ?: '../artifacts/delivery-native-build'))
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file(p.findProperty('deliveryAuditFixture') ?: '../artifacts/delivery-audit-server')
        if (!fixture.toPath().toAbsolutePath().normalize().startsWith(p.file('../artifacts').toPath().toAbsolutePath().normalize()))
            throw new GradleException('Delivery fixture must be inside task artifacts')
        p.sourceSets.main.java.srcDir(p.file('../tools/delivery-runtime-audit'))
        p.sourceSets.main.compileClasspath += p.files(p.fileTree(new File(fixture, 'mods')) { include '*.jar' })
        p.tasks.named('processResources') {
            from(p.file('../tools/delivery-runtime-audit')) { include '*.mixins.json' }
            doLast {
                new File(destinationDir, 'META-INF/neoforge.mods.toml').append('\n[[mixins]]\nconfig = "citizens-delivery-audit.mixins.json"\n', 'UTF-8')
            }
        }
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'delivery-audit-fixture.txt').isFile()) throw new GradleException('Missing delivery fixture marker')
                def properties = new Properties()
                new File(fixture, 'server.properties').withInputStream { properties.load(it) }
                for (entry in ['server-ip':'127.0.0.1','server-port':'25641','level-name':'delivery-world'])
                    if (properties.getProperty(entry.key) != entry.value) throw new GradleException('Unexpected delivery fixture properties')
            }
        }
        p.tasks.named('runServer') {
            for (name in ['Phase','Boundary','Run','Mutation','History','Shape','Storage']) if (p.hasProperty('deliveryAudit' + name))
                environment 'CITIZENS_DELIVERY_AUDIT_' + name.toUpperCase(), p.property('deliveryAudit' + name)
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[DELIVERYAUDIT] FAILED') || !log.contains('[DELIVERYAUDIT] COMPLETE'))
                    throw new GradleException('Delivery audit failed or incomplete')
            }
        }
    }
}
