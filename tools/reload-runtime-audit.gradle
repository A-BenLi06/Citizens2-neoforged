// Opt-in default-registry reload checks, confined to a synthetic server fixture.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/reload-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/reload-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'reload-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated reload fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[RELOADAUDIT] FAILED') || !log.contains('[RELOADAUDIT] COMPLETE'))
                    throw new GradleException('Reload audit failed or incomplete')
            }
        }
    }
}
