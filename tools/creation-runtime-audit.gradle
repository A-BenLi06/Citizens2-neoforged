// Native death tests are opt-in and run only in the separately prepared fixture.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/creation-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/creation-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'creation-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated death fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[CREATIONAUDIT] FAILED') || !log.contains('[CREATIONAUDIT] COMPLETE'))
                    throw new GradleException('Death audit failed or incomplete; inspect isolated latest.log')
            }
        }
    }
}
