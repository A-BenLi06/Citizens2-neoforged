allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/item-recovery-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/item-recovery-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
            systemProperty 'citizens.audit.itemRecoveryPhase', p.findProperty('item_recovery_phase') ?: 'absent'
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'item-recovery-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated item recovery fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[ITEMRECOVERYAUDIT] FAILED') || !log.contains('[ITEMRECOVERYAUDIT] COMPLETE'))
                    throw new GradleException('Item recovery audit failed or incomplete')
            }
        }
    }
}
