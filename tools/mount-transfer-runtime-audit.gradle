allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/mount-transfer-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/mount-transfer-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'mount-transfer-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated mount transfer fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[MOUNTTRANSFERAUDIT] FAILED') || !log.contains('[MOUNTTRANSFERAUDIT] COMPLETE'))
                    throw new GradleException('Mount transfer audit failed or incomplete')
            }
        }
    }
}
