allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/create-audit-server')
        p.sourceSets.dialogue.java.srcDir(p.file('../tools/create-runtime-audit'))
        p.sourceSets.dialogue.compileClasspath += p.files(p.fileTree(new File(fixture, 'mods')) { include '*.jar' },
                p.fileTree(new File(fixture, 'compile-libs')) { include '*.jar' })
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'create-audit-fixture.txt').isFile()) throw new GradleException('Missing Create fixture marker')
                def properties = new Properties()
                new File(fixture, 'server.properties').withInputStream { properties.load(it) }
                for (entry in ['server-ip':'127.0.0.1', 'server-port':'25629', 'level-name':'create-world'])
                    if (properties.getProperty(entry.key) != entry.value) throw new GradleException('Unexpected Create fixture properties')
            }
        }
        p.tasks.named('runServer') {
            if (p.hasProperty('machineAuditPhase')) environment 'CITIZENS_MACHINE_AUDIT_PHASE', p.property('machineAuditPhase')
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[CREATEAUDIT] FAILED') || !log.contains('[CREATEAUDIT] COMPLETE'))
                    throw new GradleException('Create audit failed or incomplete')
            }
        }
    }
}
