allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/quest-audit-server')
        p.sourceSets.dialogue.java.srcDir(p.file('../tools/quest-runtime-audit'))
        p.sourceSets.dialogue.compileClasspath += p.files(p.fileTree(new File(fixture, 'mods')) { include '*.jar' })
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'quest-audit-fixture.txt').isFile()) throw new GradleException('Missing quest fixture marker')
                def properties = new Properties()
                new File(fixture, 'server.properties').withInputStream { properties.load(it) }
                for (entry in ['server-ip':'127.0.0.1', 'server-port':'25628', 'level-name':'quest-world'])
                    if (properties.getProperty(entry.key) != entry.value) throw new GradleException('Unexpected quest fixture properties')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[QUESTAUDIT] FAILED') || !log.contains('[QUESTAUDIT] COMPLETE'))
                    throw new GradleException('Quest audit failed or incomplete')
            }
        }
    }
}
