// Native HPA command/snapshot checks run only in the separately prepared fixture.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/hpa-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/hpa-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'hpa-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated HPA fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[HPAAUDIT] FAILED') || !log.contains('[HPAAUDIT] COMPLETE'))
                    throw new GradleException('HPA audit failed or incomplete; inspect isolated latest.log')
            }
        }
    }
}
