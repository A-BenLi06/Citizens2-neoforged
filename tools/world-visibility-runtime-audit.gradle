allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/world-visibility-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/world-visibility-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'world-visibility-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated world visibility fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[WORLDVISIBILITYAUDIT] FAILED') || !log.contains('[WORLDVISIBILITYAUDIT] COMPLETE'))
                    throw new GradleException('World visibility audit failed or incomplete')
            }
        }
    }
}
