// Real economy integration against a separate local world and ledger.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/economy-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/economy-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
            systemProperty 'citizens.economyAuditVerify', p.findProperty('economyAuditVerify') ?: 'false'
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'mods/economy.jar').isFile())
                    throw new GradleException('Place the real Economy jar in artifacts/economy-audit-server/mods/economy.jar')
            }
        }
        p.tasks.named('runServer') {
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                def marker = p.findProperty('economyAuditVerify') == 'true' ? 'PERSISTENCE PASS' : 'COMPLETE'
                if (log.contains('[ECONOMYAUDIT] FAILED') || !log.contains('[ECONOMYAUDIT] ' + marker))
                    throw new GradleException('Real economy audit failed or incomplete; inspect isolated latest.log')
            }
        }
    }
}
