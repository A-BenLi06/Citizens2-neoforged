allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def provider = p.findProperty('permission_audit_provider') != 'false'
        def fixture = p.file(provider ? '../artifacts/permission-audit-server' : '../artifacts/permission-fallback-audit-server')
        p.sourceSets.dialogue.java.srcDir(p.file('../tools/permission-runtime-audit'))
        p.sourceSets.main.java.srcDir(p.file('../tools/permission-runtime-audit-main'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'permission-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated permission fixture before running this audit')
                if (new File(fixture, 'mods/paradigm.jar').isFile() != provider)
                    throw new GradleException('Permission fixture provider does not match the requested mode')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[PERMISSIONAUDIT] FAILED') || !log.contains('[PERMISSIONAUDIT] COMPLETE'))
                    throw new GradleException('Permission audit failed or incomplete; inspect the isolated latest.log')
            }
        }
    }
}
