allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/hologram-transfer-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/hologram-transfer-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'hologram-transfer-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated hologram transfer fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[HOLOGRAMTRANSFERAUDIT] FAILED') || !log.contains('[HOLOGRAMTRANSFERAUDIT] COMPLETE'))
                    throw new GradleException('Hologram transfer audit failed or incomplete')
            }
        }
    }
}
