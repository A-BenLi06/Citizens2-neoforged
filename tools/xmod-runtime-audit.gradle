allprojects {
    def auditBuild = gradle.startParameter.projectProperties.get('xmodAuditBuildDir')
    if (auditBuild != null) layout.buildDirectory.set(file(auditBuild))
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/xmod-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/xmod-runtime-audit'))
        p.sourceSets.main.compileClasspath += p.files(p.fileTree(new File(fixture, 'mods')) { include '*.jar' })
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'xmod-audit-fixture.txt').isFile()) throw new GradleException('Missing XMod fixture marker')
                def properties = new Properties()
                new File(fixture, 'server.properties').withInputStream { properties.load(it) }
                for (entry in ['server-ip':'127.0.0.1', 'server-port':'25631', 'level-name':'xmod-world'])
                    if (properties.getProperty(entry.key) != entry.value) throw new GradleException('Unexpected XMod fixture properties')
            }
        }
        p.tasks.named('runServer') {
            if (p.hasProperty('rewardAuditPhase')) environment 'CITIZENS_REWARD_AUDIT_PHASE', p.property('rewardAuditPhase')
            if (p.hasProperty('commerceAuditPhase')) environment 'CITIZENS_COMMERCE_AUDIT_PHASE', p.property('commerceAuditPhase')
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[XMODAUDIT] FAILED') || !log.contains('[XMODAUDIT] COMPLETE'))
                    throw new GradleException('XMod audit failed or incomplete')
            }
        }
    }
}
