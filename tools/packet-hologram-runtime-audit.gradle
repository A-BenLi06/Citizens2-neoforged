allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/packet-hologram-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/packet-hologram-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'packet-hologram-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated packet hologram fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[PACKETHOLOGRAMAUDIT] FAILED') || !log.contains('[PACKETHOLOGRAMAUDIT] COMPLETE'))
                    throw new GradleException('Packet hologram audit failed or incomplete')
            }
        }
    }
}
