allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/command-location-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/command-location-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'command-location-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated command location fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[COMMANDLOCATIONAUDIT] FAILED') || !log.contains('[COMMANDLOCATIONAUDIT] COMPLETE'))
                    throw new GradleException('Command location audit failed or incomplete')
            }
        }
    }
}
