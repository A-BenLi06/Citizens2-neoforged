// Opt-in default-registry shop-session checks, confined to a synthetic server fixture.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/shop-session-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/shop-session-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'shop-session-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated shop-session fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[SHOPSESSIONAUDIT] FAILED') || !log.contains('[SHOPSESSIONAUDIT] COMPLETE'))
                    throw new GradleException('Shop session audit failed or incomplete')
            }
        }
    }
}
