allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/rotation-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/rotation-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'rotation-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated private rotation fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[ROTATIONAUDIT] FAILED') || !log.contains('[ROTATIONAUDIT] COMPLETE'))
                    throw new GradleException('Private rotation audit failed or incomplete')
            }
        }
    }
}
