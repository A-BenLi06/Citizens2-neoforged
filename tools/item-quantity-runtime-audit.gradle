// Opt-in default-registry item-quantity checks, confined to a synthetic server fixture.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/item-quantity-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/item-quantity-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'item-quantity-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated item-quantity fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[ITEMQUANTITYAUDIT] FAILED') || !log.contains('[ITEMQUANTITYAUDIT] COMPLETE'))
                    throw new GradleException('Item quantity audit failed or incomplete')
            }
        }
    }
}
