// Native skin-command tests are opt-in and run only in the separately prepared fixture.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/skin-command-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/skin-command-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'skin-command-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated skin-command fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(5)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[SKINCOMMANDAUDIT] FAILED') || !log.contains('[SKINCOMMANDAUDIT] COMPLETE'))
                    throw new GradleException('Skin-command audit failed or incomplete; inspect isolated latest.log')
            }
        }
    }
}
