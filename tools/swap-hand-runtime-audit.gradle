allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/swap-hand-audit-server')
        p.sourceSets.dialogue.java.srcDir(p.file('../tools/swap-hand-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'swap-hand-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated swap-hand fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[SWAPHANDAUDIT] FAILED') || !log.contains('[SWAPHANDAUDIT] COMPLETE'))
                    throw new GradleException('Swap-hand audit failed or incomplete')
            }
        }
    }
}
