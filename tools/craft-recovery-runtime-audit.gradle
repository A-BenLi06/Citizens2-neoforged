// Opt-in native recovery fixture; never included in ordinary archives.
allprojects {
    layout.buildDirectory.set(file(providers.gradleProperty('craftRecoveryBuildDir').get()))
    afterEvaluate { p ->
        def fixture = p.file(p.property('craftRecoveryFixture'))
        if (!fixture.toPath().toAbsolutePath().normalize().startsWith(p.file('../artifacts').toPath().toAbsolutePath().normalize()))
            throw new GradleException('Craft recovery fixture must be inside artifacts')
        def phase = p.property('craftRecoveryPhase')
        if (!(phase in ['seed', 'recover'])) throw new GradleException('Unknown craft recovery phase')
        p.sourceSets.main.java.srcDir(p.file('../tools/craft-recovery-runtime-audit'))
        p.sourceSets.main.compileClasspath += p.files(p.fileTree(new File(fixture, 'mods')) { include '*.jar' })
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (new File(fixture, 'craft-recovery-fixture.txt').getText('UTF-8').trim() != 'citizens-craft-recovery-audit')
                    throw new GradleException('Wrong craft recovery fixture')
                def settings = new Properties()
                new File(fixture, 'server.properties').withInputStream { settings.load(it) }
                for (entry in ['server-ip':'127.0.0.1','server-port':'25646','level-name':'craft-world'])
                    if (settings.getProperty(entry.key) != entry.value) throw new GradleException('Wrong craft recovery server properties')
            }
        }
        p.tasks.named('runServer') {
            environment 'CITIZENS_CRAFT_RECOVERY_PHASE', phase
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[CRAFTRECOVERY] FAILED') || !log.contains('[CRAFTRECOVERY] COMPLETE'))
                    throw new GradleException('Craft recovery checks failed or incomplete')
            }
        }
    }
}
