allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/text-parser-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/text-parser-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'text-parser-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated text parser fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[TEXTPARSERAUDIT] FAILED') || !log.contains('[TEXTPARSERAUDIT] COMPLETE'))
                    throw new GradleException('Text parser audit failed or incomplete')
            }
        }
    }
}
