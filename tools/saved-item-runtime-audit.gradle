allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/saved-item-audit-server')
        p.sourceSets.dialogue.java.srcDir(p.file('../tools/saved-item-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'saved-item-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated saved-item fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[SAVEDITEMAUDIT] FAILED') || !log.contains('[SAVEDITEMAUDIT] COMPLETE'))
                    throw new GradleException('Saved item audit failed or incomplete')
            }
        }
    }
}
