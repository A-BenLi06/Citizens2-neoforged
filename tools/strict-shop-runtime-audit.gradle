// Opt-in default-registry strict-shop checks, confined to a synthetic server fixture.
allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/strict-shop-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/strict-shop-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'strict-shop-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated strict-shop fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[STRICTSHOPAUDIT] FAILED') || !log.contains('[STRICTSHOPAUDIT] COMPLETE'))
                    throw new GradleException('Strict shop audit failed or incomplete')
            }
        }
    }
}
