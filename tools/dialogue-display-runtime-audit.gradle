allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/dialogue-display-audit-server')
        p.sourceSets.dialogue.java.srcDir(p.file('../tools/dialogue-display-runtime-audit'))
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'dialogue-display-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated dialogue display fixture before running')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[DIALOGUEDISPLAYAUDIT] FAILED') || !log.contains('[DIALOGUEDISPLAYAUDIT] COMPLETE')
                        || !log.contains('[NATIVEACTIONAUDIT] COMPLETE') || !log.contains('[SCHEDULEDACTIONAUDIT] COMPLETE'))
                    throw new GradleException('Dialogue display audit failed or incomplete')
            }
        }
    }
}
