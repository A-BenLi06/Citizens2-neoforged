allprojects {
    def auditBuild = gradle.startParameter.projectProperties.get('loggingAuditBuildDir')
    if (auditBuild != null) layout.buildDirectory.set(file(auditBuild))
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file(p.findProperty('loggingAuditFixture') ?: '../artifacts/logging-audit-server')
        if (!fixture.toPath().toAbsolutePath().normalize().startsWith(p.file('../artifacts').toPath().toAbsolutePath().normalize()))
            throw new GradleException('Logging fixture must be inside task artifacts')
        def phase = p.findProperty('loggingAuditPhase') ?: 'native'
        def storageLock = p.findProperty('loggingAuditLock') ?: 'writer'
        if (!(storageLock in ['writer', 'reader', 'full'])) throw new GradleException('Unknown logging storage lock mode')
        if (!(phase in ['native', 'crash', 'recover', 'storage', 'storage-recover', 'shutdown', 'shutdown-recover', 'indexes', 'indexes-disabled', 'indexes-recover', 'reads', 'reads-recover', 'mysql-commands', 'mysql-commands-recover', 'mysql-schema-reject', 'entities', 'entities-recover', 'entities-migrate', 'entities-migrate-recover', 'entities-reject'])) throw new GradleException('Unknown logging audit phase')
        p.sourceSets.dialogue.java.srcDir(p.file('../tools/logging-runtime-audit'))
        p.sourceSets.dialogue.compileClasspath += p.files(p.fileTree(new File(fixture, 'mods')) { include '*.jar' },
                p.fileTree(new File(fixture, 'compile-libs')) { include '*.jar' })
        p.neoForge.runs.named('server') { gameDirectory = fixture }
        def validateFixture = {
            def marker = new File(fixture, 'logging-audit-fixture.txt')
            if (!marker.isFile() || marker.getText('UTF-8').trim() != 'citizens-logging-audit')
                throw new GradleException('Missing or incorrect logging fixture marker')
            if (phase == 'entities-reject' && !new File(fixture, 'logging-entity-rejection-original.json').isFile())
                throw new GradleException('Entity schema rejection requires an original snapshot')
            if (phase == 'entities-reject' && new File(fixture, 'logging-entity-rejection.json').exists())
                throw new GradleException('Entity schema rejection has already completed; preserve its fixture')
            if (phase == 'entities' && new File(fixture, 'logging-entity-attempt.json').exists())
                throw new GradleException('Entity acceptance requires a fresh fixture')
            if (phase == 'entities-recover' && !new File(fixture, 'logging-entity-state.json').isFile())
                throw new GradleException('Complete entity acceptance before recovery')
            if (phase == 'entities-recover' && new File(fixture, 'logging-entity-recovery.json').exists())
                throw new GradleException('Entity recovery has already completed; preserve its fixture')
            if (phase.startsWith('entities-migrate') && !new File(fixture, 'logging-entity-migration-original.json').isFile())
                throw new GradleException('Entity migration requires original stopped history evidence')
            if (phase == 'entities-migrate' && new File(fixture, 'logging-entity-migration-state.json').exists())
                throw new GradleException('Entity migration has already completed; preserve its fixture')
            if (phase == 'entities-migrate-recover' && !new File(fixture, 'logging-entity-migration-state.json').isFile())
                throw new GradleException('Complete entity migration before recovery')
            if (phase == 'entities-migrate-recover' && new File(fixture, 'logging-entity-migration-recovery.json').exists())
                throw new GradleException('Entity migration recovery has already completed; preserve its fixture')
            if (phase == 'mysql-commands' && new File(fixture, 'logging-mysql-command-attempt.json').exists())
                throw new GradleException('MySQL command acceptance requires a fresh fixture')
            if (phase == 'mysql-commands-recover' && !new File(fixture, 'logging-mysql-command-state.json').isFile())
                throw new GradleException('Complete MySQL command acceptance before recovery')
            if (phase == 'mysql-commands-recover' && new File(fixture, 'logging-mysql-command-recovery.json').exists())
                throw new GradleException('MySQL command recovery has already completed; preserve its fixture')
            if (phase == 'mysql-schema-reject' && !new File(fixture, 'logging-mysql-schema-original.json').isFile())
                throw new GradleException('Schema rejection requires an original input snapshot')
            if (phase == 'mysql-schema-reject' && new File(fixture, 'logging-mysql-schema-rejection.json').exists())
                throw new GradleException('Schema rejection has already completed; preserve its fixture')
            if (phase.startsWith('reads') && !new File(fixture, 'logging-index-original.json').isFile())
                throw new GradleException('Read acceptance requires a copied original stopped database')
            if (phase == 'reads' && new File(fixture, 'logging-read-state.json').exists())
                throw new GradleException('Read acceptance requires a fresh fixture')
            if (phase == 'reads-recover' && !new File(fixture, 'logging-read-state.json').isFile())
                throw new GradleException('Complete read acceptance before recovery')
            if (phase == 'reads-recover' && new File(fixture, 'logging-read-recovery.json').exists())
                throw new GradleException('Read recovery has already completed; preserve its fixture')
            if (phase.startsWith('indexes') && !new File(fixture, 'logging-index-original.json').isFile())
                throw new GradleException('Index acceptance requires the original stopped database snapshot')
            if (phase in ['indexes', 'indexes-disabled'] && new File(fixture, 'logging-index-state.json').exists())
                throw new GradleException('Index acceptance requires a fresh fixture')
            if (phase == 'indexes-recover' && !new File(fixture, 'logging-index-result.json').isFile())
                throw new GradleException('Complete index acceptance before recovery')
            if (phase == 'indexes-recover' && new File(fixture, 'logging-index-recovery.json').exists())
                throw new GradleException('Index recovery has already completed; preserve its fixture')
            if (phase == 'recover' && !new File(fixture, 'logging-restart-state.json').isFile())
                throw new GradleException('Run the native logging phase before recovery')
            if (phase == 'storage-recover' && !new File(fixture, 'logging-storage-state.json').isFile())
                throw new GradleException('Run the native storage phase before recovery')
            if (phase == 'storage' && new File(fixture, 'logging-storage-state.json').exists())
                throw new GradleException('Storage acceptance requires a fresh fixture')
            if (phase == 'storage-recover' && new File(fixture, 'logging-storage-recovery.json').exists())
                throw new GradleException('Storage recovery has already completed; preserve its fixture')
            if (phase == 'shutdown' && new File(fixture, 'logging-shutdown-state.json').exists())
                throw new GradleException('Shutdown acceptance requires a fresh fixture')
            if (phase == 'shutdown-recover' && !new File(fixture, 'logging-shutdown-result.json').isFile())
                throw new GradleException('Complete shutdown acceptance before recovery')
            if (phase == 'shutdown-recover' && new File(fixture, 'logging-shutdown-recovery.json').exists())
                throw new GradleException('Shutdown recovery has already completed; preserve its fixture')
            def properties = new Properties()
            new File(fixture, 'server.properties').withInputStream { properties.load(it) }
            for (entry in ['server-ip':'127.0.0.1', 'server-port':'25632', 'level-name':'logging-world'])
                if (properties.getProperty(entry.key) != entry.value) throw new GradleException('Unexpected logging fixture properties')
        }
        p.tasks.named('prepareServerRun') { doLast { validateFixture() } }
        p.tasks.named('runServer') {
            doFirst { validateFixture() }
            environment 'CITIZENS_LOGGING_AUDIT_PHASE', phase
            environment 'CITIZENS_LOGGING_AUDIT_LOCK', storageLock
            if (p.hasProperty('loggingAuditRun')) environment 'CITIZENS_LOGGING_AUDIT_RUN', p.property('loggingAuditRun')
            timeout = java.time.Duration.ofMinutes(3)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[LOGGINGAUDIT] FAILED') || !log.contains('[LOGGINGAUDIT] COMPLETE'))
                    throw new GradleException('Logging audit failed or incomplete')
            }
        }
    }
}
