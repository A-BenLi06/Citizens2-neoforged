allprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('neoForge') == null) return
        def fixture = p.file('../artifacts/bukkit-meta-audit-server')
        p.sourceSets.main.java.srcDir(p.file('../tools/bukkit-meta-runtime-audit'))
        p.neoForge.runs.named('server') {
            gameDirectory = fixture
            systemProperty 'citizens.audit.legacyMetaFixtures', p.file('src/test/resources/legacy-meta').absolutePath
        }
        p.tasks.named('prepareServerRun') {
            doLast {
                if (!new File(fixture, 'bukkit-meta-audit-fixture.txt').isFile())
                    throw new GradleException('Prepare the isolated Bukkit metadata fixture first')
            }
        }
        p.tasks.named('runServer') {
            timeout = java.time.Duration.ofMinutes(4)
            doLast {
                def log = new File(fixture, 'logs/latest.log').getText('UTF-8')
                if (log.contains('[BUKKITMETAAUDIT] FAILED') || !log.contains('[BUKKITMETAAUDIT] COMPLETE'))
                    throw new GradleException('Bukkit metadata audit failed or incomplete')
            }
        }
    }
}
