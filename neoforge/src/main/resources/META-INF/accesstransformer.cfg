# Citizens access transformers.
#
# Only widened where a vanilla field has to be written to build the fake player NPC. CraftBukkit exposes these
# incidentally through its remap, which is why upstream Citizens never needed an equivalent file.

# A ServerPlayer requires a live Connection. The dummy connection built for a player NPC has no socket, so both fields
# are assigned directly instead of going through Connection's networking path.
public net.minecraft.network.Connection channel
public net.minecraft.network.Connection address

# Player NPCs do not run Player.tick; equipment changes still need native attributes and viewer packets.
public net.minecraft.world.entity.LivingEntity detectEquipmentUpdates()V

# Minecraft's player-info constructor always sets listed=true. The adapter builds explicit immutable Entry records
# before publishing its packet so tab-list visibility can be false without dropping the skin profile.
public-f net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket entries

# The original player-list setting updates both the world collection and ChunkMap's player/ticket index.
public net.minecraft.server.level.ChunkMap updatePlayerStatus(Lnet/minecraft/server/level/ServerPlayer;Z)V

# Hologram renderers configure display entities that vanilla only ever configures from NBT, so every setter is private.
# Bukkit exposes the same knobs through TextDisplay/Display/ArmorStand, which is why upstream Citizens needs no
# equivalent. Widening the setters is preferred over the alternative of round-tripping a CompoundTag through
# Entity#load, which would also reset position and every other field that has no tag.
public net.minecraft.world.entity.Display setTransformation(Lcom/mojang/math/Transformation;)V
# Preserve unconfigured transformation components when a display trait changes just one of them.
public net.minecraft.world.entity.Display createTransformation(Lnet/minecraft/network/syncher/SynchedEntityData;)Lcom/mojang/math/Transformation;
public net.minecraft.world.entity.Display setBillboardConstraints(Lnet/minecraft/world/entity/Display$BillboardConstraints;)V
public net.minecraft.world.entity.Display setTransformationInterpolationDuration(I)V
public net.minecraft.world.entity.Display setTransformationInterpolationDelay(I)V
public net.minecraft.world.entity.Display setPosRotInterpolationDuration(I)V
public net.minecraft.world.entity.Display setViewRange(F)V
public net.minecraft.world.entity.Display setShadowRadius(F)V
public net.minecraft.world.entity.Display setShadowStrength(F)V
public net.minecraft.world.entity.Display$TextDisplay setText(Lnet/minecraft/network/chat/Component;)V
# Hologram packet overlays use native typed accessors instead of protocol-version metadata indices.
public net.minecraft.world.entity.Display$TextDisplay DATA_TEXT_ID
public net.minecraft.world.entity.Entity DATA_CUSTOM_NAME
public net.minecraft.world.entity.Entity DATA_CUSTOM_NAME_VISIBLE
public net.minecraft.world.entity.Display$TextDisplay setFlags(B)V
public net.minecraft.world.entity.Display$TextDisplay getFlags()B
