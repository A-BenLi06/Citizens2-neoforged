public net.minecraft.world.entity.Display$TextDisplay setLineWidth(I)V
public net.minecraft.world.entity.Display$TextDisplay setTextOpacity(B)V

# ArmorStand: the two flags a nameplate/point armour stand needs are private, the rest are already public.
public net.minecraft.world.entity.decoration.ArmorStand setSmall(Z)V
public net.minecraft.world.entity.decoration.ArmorStand setMarker(Z)V

# Interaction: sized to match the NPC so the hologram is clickable where the NPC is.
public net.minecraft.world.entity.Interaction setWidth(F)V
public net.minecraft.world.entity.Interaction setHeight(F)V
public net.minecraft.world.entity.Interaction setResponse(Z)V

# Two mob flags vanilla only ever sets from its own AI or from NBT, with no setter of any visibility. Bukkit exposes
# both (Creeper#setPowered, and "angry" enderman), and Citizens persists them, so the synced-data keys are widened and
# written directly.
public net.minecraft.world.entity.monster.Creeper DATA_IS_POWERED
public net.minecraft.world.entity.monster.EnderMan DATA_CREEPY

# Saddling a pig or strider. Vanilla's Saddleable#equipSaddle sets the flag to true whatever stack it is handed, and
# offers no way back off, so it cannot express "unsaddle" — Bukkit's Steerable#setSaddle(boolean) can, and Citizens lets
# you toggle. Writing the synced key directly is symmetric. These are the same two types upstream's trait supports.
public net.minecraft.world.entity.animal.Pig DATA_SADDLE_ID
public net.minecraft.world.entity.monster.Strider DATA_SADDLE_ID

# Same story for three more cosmetic flags Citizens persists: a cat's collar colour, and a goat's two horns (vanilla only
# ever breaks a horn off, never puts one back).
public net.minecraft.world.entity.animal.Cat setCollarColor(Lnet/minecraft/world/item/DyeColor;)V
public net.minecraft.world.entity.animal.goat.Goat DATA_HAS_LEFT_HORN
public net.minecraft.world.entity.animal.goat.Goat DATA_HAS_RIGHT_HORN

# Sniffer animation state. transitionTo is public but the matching getter is not, and the state has to be read back:
# every transition restarts an animation, so it may only be written when it has actually drifted.
public net.minecraft.world.entity.animal.sniffer.Sniffer getState()Lnet/minecraft/world/entity/animal/sniffer/Sniffer$State;

# Fourth batch, same story again: cosmetic mob state that Citizens persists and Bukkit exposes through its entity
# interfaces, but which vanilla only ever writes from its own AI or from NBT.
public net.minecraft.world.entity.animal.Bee setHasNectar(Z)V
public net.minecraft.world.entity.animal.Bee setHasStung(Z)V
public net.minecraft.world.entity.animal.Fox setSleeping(Z)V
public net.minecraft.world.entity.animal.Fox setFaceplanted(Z)V
public net.minecraft.world.entity.animal.horse.Llama setStrength(I)V
public net.minecraft.world.entity.monster.Shulker setRawPeekAmount(I)V

# A tropical fish stores pattern and both colours packed into one synced int; nothing public writes it as a whole, and
# the public setVariant only replaces the pattern half.
public net.minecraft.world.entity.animal.TropicalFish setPackedVariant(I)V
public net.minecraft.world.entity.animal.TropicalFish packVariant(Lnet/minecraft/world/entity/animal/TropicalFish$Pattern;Lnet/minecraft/world/item/DyeColor;Lnet/minecraft/world/item/DyeColor;)I

# setIsCastingSpell is public but the enum naming the spell is protected, so the type cannot be referred to from here.
public net.minecraft.world.entity.monster.SpellcasterIllager$IllagerSpell

# The item or block an NPC displays. Upstream writes this from a controller subclass per entity type (ItemDisplay,
# BlockDisplay, Item, FallingBlock, OminousItemSpawner); this port has one generic controller instead, so it needs the
# setters vanilla keeps private because it only ever reads them from NBT. Bukkit exposes all of them.
public net.minecraft.world.entity.Display$ItemDisplay setItemStack(Lnet/minecraft/world/item/ItemStack;)V
public net.minecraft.world.entity.Display$ItemDisplay setItemTransform(Lnet/minecraft/world/item/ItemDisplayContext;)V
public net.minecraft.world.entity.Display$BlockDisplay setBlockState(Lnet/minecraft/world/level/block/state/BlockState;)V
public net.minecraft.world.entity.OminousItemSpawner setItem(Lnet/minecraft/world/item/ItemStack;)V
public net.minecraft.world.entity.item.FallingBlockEntity blockState

# The last three Display setters the standalone DisplayTrait needs; the rest were widened for the hologram renderers.
public net.minecraft.world.entity.Display setWidth(F)V
public net.minecraft.world.entity.Display setHeight(F)V
public net.minecraft.world.entity.Display setBrightnessOverride(Lnet/minecraft/util/Brightness;)V

# A wither and an ender dragon already own a boss bar; BossBarTrait drives that one rather than adding a second. Both
# fields are private, and Bukkit reaches them through CraftBossBar, which is why upstream needs reflection here instead.
public net.minecraft.world.entity.boss.wither.WitherBoss bossEvent
public net.minecraft.world.level.dimension.end.EndDragonFight dragonEvent

# A horse's coat colour and markings are packed into one synced int and written only together, by a private method.
# Bukkit exposes setColor/setStyle separately, and Citizens persists both.
public net.minecraft.world.entity.animal.horse.Horse setVariantAndMarkings(Lnet/minecraft/world/entity/animal/horse/Variant;Lnet/minecraft/world/entity/animal/horse/Markings;)V
# The saddle lives in the horse's own container, which is protected. Needed to read the saddle back, so a saddle a
# player puts on by hand is persisted — that is what upstream's run() does through Bukkit's horse inventory.
public net.minecraft.world.entity.animal.horse.AbstractHorse inventory
# A wolf's collar colour: private setter, exposed by Bukkit, persisted by Citizens.
public net.minecraft.world.entity.animal.Wolf setCollarColor(Lnet/minecraft/world/item/DyeColor;)V

# An item frame's facing and its "fixed" flag, both non-public in vanilla and both exposed by Bukkit.
public net.minecraft.world.entity.decoration.ItemFrame setDirection(Lnet/minecraft/core/Direction;)V
public net.minecraft.world.entity.decoration.ItemFrame fixed

# An NPC's look control is replaced with one that does not zero the pitch every tick. Vanilla's LookControl.tick does
# exactly that, and it runs from Mob.serverAiStep, which clearing goals and brain behaviours does not stop — so an NPC
# could never hold a pitch. Upstream avoids it by overriding serverAiStep in its own entity subclasses and ticking the
# controls itself; with vanilla entities the control has to be swapped instead.
public net.minecraft.world.entity.Mob lookControl

# A player NPC flying with an elytra equipped has to be put into the gliding pose, or the client draws it upright and
# sliding through the air. Vanilla sets shared flag 7 for this and keeps the setter protected; Bukkit exposes the same
# thing as Player#setGliding, which is what upstream's PlayerAnimation.START_ELYTRA drives.
public net.minecraft.world.entity.Entity setSharedFlag(IZ)V

# BoundingBoxTrait resizes an NPC's hitbox. Vanilla recomputes the box from this field on every move, so writing the box
# alone would be undone a tick later; Bukkit exposes no equivalent either, which is why upstream reaches it from its own
# entity subclasses instead.
public net.minecraft.world.entity.Entity dimensions

# Controllable reads the rider's jump key. The server records it from the client's input packet but keeps the flag
# protected and offers only a setter; Bukkit exposes it through PlayerInputEvent, which is what upstream reads.
public net.minecraft.world.entity.LivingEntity jumping

# A PacketNPC's entity is never added to a level, which leaves it flagged as removed - and ServerEntity refuses to build
# pairing data for a removed entity, so nothing would ever be sent to a viewer. Vanilla keeps the un-flag protected
# because nothing but the chunk map has cause to call it; CraftBukkit exposes it incidentally through its remap.
public net.minecraft.world.entity.Entity unsetRemoved()V
